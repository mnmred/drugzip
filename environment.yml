name: ccsynergy
channels:
  - conda-forge
dependencies:
  # README Environment Setup (exact pins)
  - python=3.10
  - numpy=1.23.5
  - scipy=1.10.1
  - pandas=2.0.3
  - scikit-learn=1.3.0
  - h5py
  - pip
  - pip:
      # CUDA runtime + cuDNN via nvidia-* wheels; host driver via apptainer --nv
      - "tensorflow[and-cuda]>=2.15,<2.17"
      - wandb
